name: Tieni sveglio Supabase

# Il piano gratuito di Supabase mette in pausa il database quando l'attivita'
# della settimana precedente e' insufficiente. Attenzione: NON basta una
# richiesta "entro 7 giorni" — Supabase valuta il volume di attivita' e si
# aspetta qualche richiesta al giorno.
#
# Lezione imparata il 25/08/2026: la prima versione di questo controllo
# interrogava il database ogni 3 giorni e NON e' bastato. Il progetto e' andato
# in pausa tra il 13 e il 16 agosto 2026 e i messaggi privati sono diventati
# invisibili nell'app (le letture falliscono in silenzio, l'interfaccia resta
# in piedi ma vuota). Da qui: tre ping al giorno, uno per fascia oraria.
#
# URL e chiave NON sono scritti qui: vengono letti da app.html, che e' la
# fonte di verita'. Se un giorno cambiano li', il controllo si adegua da solo.
# (La chiave anon e' gia' pubblica nel codice del sito: e' fatta per stare
# nel browser, non e' una password.)

on:
  schedule:
    # tre volte al giorno (06:00, 14:00, 22:00 UTC): copre ogni giorno della
    # settimana, cosi' l'attivita' non scende mai sotto la soglia di Supabase.
    # NB: non usare '*/N' sul giorno del mese — a fine mese salta e lascia buchi.
    - cron: '0 6,14,22 * * *'
  # permette di lanciarlo a mano dalla tab "Actions" di GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Leggi URL e chiave da app.html
        id: cfg
        run: |
          URL=$(sed -n "s/.*const SUPABASE_URL = '\([^']*\)'.*/\1/p" app.html | head -1)
          KEY=$(sed -n "s/.*const SUPABASE_KEY = '\([^']*\)'.*/\1/p" app.html | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::URL o chiave non trovati in app.html (le righe const SUPABASE_URL / SUPABASE_KEY sono cambiate?)"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Configurazione letta da app.html: $URL"

      - name: Interroga il database
        run: |
          CODE=$(curl -s -o /tmp/risposta.txt -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H "Authorization: Bearer ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/rest/v1/profiles?select=session_id&limit=1")

          echo "Risposta HTTP: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Il database NON risponde (HTTP $CODE). Se e' 000 o 5xx il progetto potrebbe essere di nuovo in pausa: vai su supabase.com/dashboard con l'account Ireneacqua, organizzazione awakening, apri Global Awakening e premi Resume project."
            head -c 500 /tmp/risposta.txt
            exit 1
          fi
          echo "Database sveglio e funzionante."
